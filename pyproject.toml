[project]
name = "synthetic-ehr-privacy-by-design"
version = "0.1.0"
description = "A synthetic EHR, built privacy-by-design. Every row is fake."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.63.0",
    "numpy>=2.5.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.uv]
# Not an installable package yet; uv only manages the environment.
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
# The generator is not installed as a package; let tests import it from the repo root.
pythonpath = ["."]
